<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Colors</title>
    <link rel="stylesheet" href="color.css">
</head>
<body>
    <h1>Where to Use Colors</h1>

    <p class="color-example text-color">
        Color changes the text color.
    </p>

    <p class="color-example background-color">
        Background-color changes the background.
    </p>

    <p class="color-example border-color">
        This element has a green border.
    </p>

    <p class="color-example outline-color">
        This element has a purple outline.
    </p>

    <div class="color-example box-shadow">
        This box has a shadow.
    </div>

    <h2 class="text-shadow">This text has a shadow.</h2>

    <h2>SVG Fill Color</h2>

    <svg width="150" height="120" viewBox="0 0 150 120">
        <title>Orange circle</title>
        <circle class="svg-fill" cx="75" cy="60" r="45" />
    </svg>
</body>
</html>
