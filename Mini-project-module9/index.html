<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Bono App | Sign Up</title>

  <!-- Font Awesome icons -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  >

  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap"
    rel="stylesheet"
  >

  <link rel="icon" href="images/favicon.png">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="wrapper">

    <!-- Header -->
    <header class="header">
      <a href="index.html">
        <img
          src="images/logo.svg"
          alt="Bono home"
          class="logo"
        >
      </a>

      <div class="header-right">
        <a href="mailto:sreyoseeprapti1@bono.com">
          <i class="fas fa-envelope" aria-hidden="true"></i>
          sreyoseeprapti1@bono.com
        </a>

        <a href="tel:+310218008244">
          <i class="fas fa-phone" aria-hidden="true"></i>
          (+31) 021-800-8244
        </a>

        <a href="https://twitter.com/" aria-label="Visit Twitter">
          <i class="fa-brands fa-twitter" aria-hidden="true"></i>
        </a>
      </div>
    </header>

    <!-- Main content -->
    <main class="main-content">

      <!-- Contact form -->
      <form>
        <div class="form-group">
          <label for="name">Name</label>
          <input
            type="text"
            name="name"
            id="name"
            autocomplete="name"
            required
          >
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input
            type="email"
            name="email"
            id="email"
            autocomplete="email"
            required
          >
        </div>

        <div class="form-group">
          <label for="message">Message</label>
          <textarea
            name="message"
            id="message"
            rows="4"
          ></textarea>
        </div>

        <div class="form-group">
          <button type="submit" class="btn">Submit</button>
        </div>
      </form>

      <!-- Introduction -->
      <div class="text-container">
        <h1>Coming Soon For Every Developer</h1>

        <p>
          Our new Bono web app will change the way you think about
          content management and will allow you to focus on what's
          really important. Use the contact form to send us your thoughts.
        </p>
      </div>

    </main>
  </div>
</body>
</html>
