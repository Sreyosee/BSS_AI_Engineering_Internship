<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Position Property</title>
    <link rel="stylesheet" href="position.css">
</head>
<body>
    <h1>Position Property</h1>

    <div class="sticky">Sticky: scroll down to test me.</div>

    <h2>Static</h2>
    <div class="box static">Normal document position.</div>

    <h2>Relative</h2>
    <div class="box relative">
        Shifted from its normal position.
    </div>

    <h2>Absolute</h2>
    <div class="parent">
        Relative parent
        <div class="absolute">Absolute child</div>
    </div>

    <div class="fixed">Fixed at bottom-right</div>

    <p>Scroll down to compare sticky and fixed positioning.</p>
</body>
</html>
