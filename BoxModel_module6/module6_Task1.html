<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Freelance Form</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playwrite+IT+Trad:wght@100..400&family=Poppins:wght@100;200;300&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="module6_Task1.css">
</head>
<body>
  <main class="container">
    <div class="card">
        <h1>Need to hire a Freelancer?</h1>
        <p>Sign up, type in what you need and receive
             free quotes in seconds.
        </p>
        <form>
            <div class="form-group">
                <input type="text" id="text" name="text" placeholder="What do you need done?">
            </div>

            <div class="form-group">
                <button type="submit">Post a Project</button>
            </div>
        </form>
  </main>


</body>
</html>
