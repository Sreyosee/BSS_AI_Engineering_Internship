<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display Property</title>
    <link rel="stylesheet" href="display.css">
</head>
<body>
    <h1>Display Property</h1>

    <h2>Block</h2>
    <span class="block">First block</span>
    <span class="block">Second block</span>

    <h2>Inline</h2>
    <div class="inline">First inline</div>
    <div class="inline">Second inline</div>

    <h2>Inline Block</h2>
    <div class="inline-block">First box</div>
    <div class="inline-block">Second box</div>

    <h2>None</h2>
    <p class="none">This paragraph is not displayed.</p>
    <p>The hidden paragraph takes up no layout space.</p>

    <h2>Flex</h2>
    <div class="flex">
        <div>One</div>
        <div>Two</div>
        <div>Three</div>
    </div>

    <h2>Grid</h2>
    <div class="grid">
        <div>One</div>
        <div>Two</div>
        <div>Three</div>
        <div>Four</div>
    </div>
</body>
</html>
