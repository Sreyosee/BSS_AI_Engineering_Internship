<!DOCTYPE html> 
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Practice 6 - Text Features</title>
</head>
<body>
    <h1>More HTML Text Features</h1>

    <h2>Preformatted Text</h2>
    <pre>
Name:    Prapti
Subject: HTML
Goal:    Learn web development
    </pre>

    <h2>Line Breaks</h2>
    <p>
        House 10<br>
        Road 5<br>
        Dhaka, Bangladesh
    </p>

    <hr>

    <h2>HTML Entities</h2>
    <p>Less than: &lt;</p>
    <p>Greater than: &gt;</p>
    <p>Ampersand: &amp;</p>
    <p>Copyright: &copy;</p>
    <p>Display an HTML tag: &lt;p&gt;</p>
    <p>Keep these words together: 100&nbsp;BDT</p>
</body>
</html>
