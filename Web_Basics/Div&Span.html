<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice 7 - Div and Span</title>
</head>
<body>
    <h1>Div and Span</h1>

    <div style="background-color: lightblue; padding: 15px;">
        <h2>About My Internship</h2>
        <p>I am learning HTML and CSS.</p>
        <p>This div groups a heading and two paragraphs.</p>
    </div>

    <div style="background-color: lightyellow; padding: 15px;">
        <h2>My Goal</h2>
        <p>
            I want to become an
            <span style="color: blue;">AI engineer</span>.
        </p>
    </div>
</body>
</html>
