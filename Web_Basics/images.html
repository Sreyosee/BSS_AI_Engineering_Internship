<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice 4 - Images</title>
</head>
<body>
    <h1>Working with Images</h1>

    <h2>Local Image</h2>
    <img
        src="flower.JPG"
        alt="A flower"
        width="300">

    <h2>Random Online Image</h2>
    <img
        src="https://picsum.photos/300/200"
        alt="A randomly selected photograph"
        width="300"
        height="200">

    <h2>Image with a Caption</h2>
    <figure>
        <img
            src="flower.JPG"
            alt="A flower"
            width="200">

        <figcaption>A flower from my image collection.</figcaption>
    </figure>
</body>
</html>
