<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVG Practice</title>
</head>
<body>
    <h1>SVG Shapes</h1>

    <h2>Circle</h2>
    <svg width="200" height="150" viewBox="0 0 200 150">
        <title>Blue circle</title>
        <circle cx="100" cy="75" r="50"
                fill="lightblue" stroke="blue" stroke-width="3" />
    </svg>

    <h2>Rectangle</h2>
    <svg width="200" height="150" viewBox="0 0 200 150">
        <title>Green rectangle</title>
        <rect x="20" y="30" width="160" height="90"
              fill="lightgreen" stroke="green" stroke-width="3" />
    </svg>

    <h2>Line</h2>
    <svg width="200" height="150" viewBox="0 0 200 150">
        <title>Red diagonal line</title>
        <line x1="20" y1="20" x2="180" y2="130"
              stroke="red" stroke-width="4" />
    </svg>

    <h2>Ellipse</h2>
    <svg width="200" height="150" viewBox="0 0 200 150">
        <title>Purple ellipse</title>
        <ellipse cx="100" cy="75" rx="80" ry="40"
                 fill="plum" stroke="purple" stroke-width="3" />
    </svg>

    <h2>Triangle</h2>
    <svg width="200" height="150" viewBox="0 0 200 150">
        <title>Orange triangle</title>
        <polygon points="100,20 20,130 180,130"
                 fill="orange" stroke="black" stroke-width="2" />
    </svg>

    <h2>Text</h2>
    <svg width="300" height="100" viewBox="0 0 300 100">
        <title>Text saying Hello SVG</title>
        <text x="20" y="60" fill="darkblue" font-size="32">
            Hello SVG!
        </text>
    </svg>
</body>
</html>
