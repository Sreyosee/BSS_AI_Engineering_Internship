<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox Basics</title>
    <link rel="stylesheet" href="flex-basics.css">
</head>
<body>
    <h1>Flexbox Containers and Alignment</h1>

    <h2>Basic Row</h2>
    <div class="container row">
        <div class="box">One</div>
        <div class="box">Two</div>
        <div class="box">Three</div>
    </div>

    <h2>Column Direction</h2>
    <div class="container column">
        <div class="box">One</div>
        <div class="box">Two</div>
        <div class="box">Three</div>
    </div>

    <h2>Justify Content: Space Between</h2>
    <div class="container space-between">
        <div class="box">One</div>
        <div class="box">Two</div>
        <div class="box">Three</div>
    </div>

    <h2>Align Items: Center</h2>
    <div class="container align-center">
        <div class="box">One</div>
        <div class="box tall">Tall box</div>
        <div class="box">Three</div>
    </div>

    <h2>Center on Both Axes</h2>
    <div class="container centered">
        <div class="box">Centered</div>
    </div>

    <h2>Wrapping</h2>
    <p>Resize your browser to see the boxes wrap.</p>

    <div class="container wrapping">
        <div class="box">One</div>
        <div class="box">Two</div>
        <div class="box">Three</div>
        <div class="box">Four</div>
        <div class="box">Five</div>
    </div>
</body>
</html>
