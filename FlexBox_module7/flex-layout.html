<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox Layout</title>
    <link rel="stylesheet" href="flex-layout.css">
</head>
<body>
    <header class="header">
        <h1>My Learning Website</h1>

        <nav aria-label="Main navigation">
            <a href="#home">Home</a>
            <a href="#courses">Courses</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>

    <div class="layout">
        <aside class="sidebar">
            <h2>Topics</h2>
            <ul>
                <li>HTML</li>
                <li>CSS</li>
                <li>Flexbox</li>
            </ul>
        </aside>

        <main id="home" class="main">
            <h2>Welcome!</h2>
            <p>This page uses Flexbox for its layout.</p>

            <section id="courses">
                <h2>My Courses</h2>

                <div class="cards">
                    <article class="card">
                        <h3>HTML</h3>
                        <p>Learn how to structure web pages.</p>
                    </article>

                    <article class="card">
                        <h3>CSS</h3>
                        <p>Learn how to style web pages.</p>
                    </article>

                    <article class="card">
                        <h3>Flexbox</h3>
                        <p>Learn how to arrange elements.</p>
                    </article>
                </div>
            </section>
        </main>
    </div>

    <footer id="contact">
        <p>Contact: prapti@example.com</p>
    </footer>
</body>
</html>
