<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fluid Typography and Media Queries</title>
  <link rel="stylesheet" href="fluid-typography.css">
</head>
<body>
  <main>
    <section class="hero">
      <h1>Learn. Build. Grow.</h1>
      <p>
        This heading changes size smoothly as the browser width changes.
      </p>
      <a href="#topics">Explore Topics</a>
    </section>

    <section class="topics" id="topics">
      <h2>Responsive Design Topics</h2>

      <div class="topic-list">
        <article>
          <h3>Viewport Units</h3>
          <p>vw depends on viewport width. vh depends on viewport height.</p>
        </article>

        <article>
          <h3>Media Queries</h3>
          <p>Different styles apply when the viewport reaches a breakpoint.</p>
        </article>
      </div>
    </section>
  </main>
</body>
</html>
