<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Layout</title>
  <link rel="stylesheet" href="responsive-layout.css">
</head>
<body>
  <main class="container">
    <h1>My Learning Journey</h1>
    <p>Resize the browser to see how the cards adjust.</p>

    <div class="cards">
      <article class="card">
        <h2>HTML</h2>
        <p>HTML creates the structure of a webpage.</p>
      </article>

      <article class="card">
        <h2>CSS</h2>
        <p>CSS adds colors, spacing and layouts.</p>
      </article>

      <article class="card">
        <h2>JavaScript</h2>
        <p>JavaScript makes a webpage interactive.</p>
      </article>
    </div>
  </main>
</body>
</html>
