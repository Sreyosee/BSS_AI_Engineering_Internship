
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apartment Search</title>
</head>
<body>

    <header>
         <h2> Module 3 task by Sreyosee Alam Prapti</h2>
        <h1>Apartment Search</h1>
    </header>

    <main>
        <form name="apartment-search" method="POST" data-netlify="true">

            <label for="location">Location:</label>
            <input type="text" id="location" name="location" required>
            <br><br>

            <label for="price-range">Price Range:</label>
            <input type="range" id="price-range" name="price-range" min="0" max="5000" step="100">
            <br><br>

            <label for="bedrooms">Number of Bedrooms:</label>
            <input type="number" id="bedrooms" name="bedrooms" min="0">
            <br><br>

            <label for="bathrooms">Number of Bathrooms:</label>
            <input type="number" id="bathrooms" name="bathrooms" min="0">
            <br><br>

            <label for="pets">Pets Allowed:</label>
            <input type="checkbox" id="pets" name="pets">
            <br><br>

            <label for="date">Date Available:</label>
            <input type="date" id="date" name="date">
            <br><br>

            <button type="submit">Submit</button>

        </form>
    </main>

</body>
</html>
